spring.application.name: coffee-api
spring.profiles.active: local-dev

spring:
  config:
    import:
      - optional:classpath:db-core.yml
      - optional:classpath:monitoring.yml
      - optional:classpath:logging.yml
  web.resources.add-mappings: true

server:
  tomcat:
    max-connections: 20000
    threads:
      max: 600
      min-spare: 100

---
spring.config.activate.on-profile: local
app:
  init-seed-data:
    enabled: true
payment:
  toss:
    secret-key: test_sk_24xLea5zVAJG0k9PKDayrQAMYNwW
    base-url: https://api.tosspayments.com/v1
spring:
  kafka:
    listener:
      auto-startup: false

---
spring.config.activate.on-profile: local-dev
app:
  init-seed-data:
    enabled: true
spring:
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: coffee-stamp-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.coffee.gu.*"
payment:
  toss:
    secret-key: test_sk_24xLea5zVAJG0k9PKDayrQAMYNwW
    base-url: https://api.tosspayments.com/v1


---
spring.config.activate.on-profile: dev


---
spring.config.activate.on-profile: staging


---
spring.config.activate.on-profile: live

