spring.application.name: coffee-api
spring.profiles.active: local-dev

spring:
  config:
    import:
      - optional:classpath:db-core.yml
      - optional:classpath:monitoring.yml
      - optional:classpath:logging.yml
  web.resources.add-mappings: true

server:
  forward-headers-strategy: native
  tomcat:
    max-connections: 20000
    threads:
      max: 600
      min-spare: 100

gemini:
  api:
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-3.5-flash-lite
    key: ${GEMINI_API_KEY:dummy-key}
    connect-timeout-seconds: 5
    read-timeout-seconds: 60

security:
  gateway:
    internal-token:
      enabled: false
      secret: ${GATEWAY_INTERNAL_TOKEN_SECRET:}
  delivery-webhook:
    ip-whitelist:
      enabled: false
      baemin: ${BAEMIN_WEBHOOK_ALLOWED_IPS:127.0.0.1,::1}
      coupang-eats: ${COUPANG_EATS_WEBHOOK_ALLOWED_IPS:127.0.0.1,::1}
    signature:
      enabled: false
      baemin-secret: ${BAEMIN_WEBHOOK_SECRET:local-baemin-webhook-secret}
      coupang-eats-secret: ${COUPANG_EATS_WEBHOOK_SECRET:local-coupang-eats-webhook-secret}
  payment-webhook:
    toss:
      ip-whitelist:
        enabled: false
        allowed-ips: ${TOSS_WEBHOOK_ALLOWED_IPS:127.0.0.1,::1}
      signature:
        enabled: false
        secret: ${TOSS_WEBHOOK_SECRET:local-toss-webhook-secret}

---
spring.config.activate.on-profile: local
app:
  init-seed-data:
    enabled: true
payment:
  toss:
    secret-key: test_sk_24xLea5zVAJG0k9PKDayrQAMYNwW
    base-url: https://api.tosspayments.com/v1
spring:
  kafka:
    listener:
      auto-startup: false

---
spring.config.activate.on-profile: local-dev
app:
  init-seed-data:
    enabled: true
spring:
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: coffee-stamp-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.coffee.gu,com.coffee.gu.*"
    listener:
      concurrency: 3
payment:
  toss:
    secret-key: test_sk_24xLea5zVAJG0k9PKDayrQAMYNwW
    base-url: https://api.tosspayments.com/v1


---
spring.config.activate.on-profile: dev
security:
  gateway:
    internal-token:
      enabled: true
      secret: ${GATEWAY_INTERNAL_TOKEN_SECRET}
  delivery-webhook:
    ip-whitelist:
      enabled: true
    signature:
      enabled: true
  payment-webhook:
    toss:
      ip-whitelist:
        enabled: true
      signature:
        enabled: true


---
spring.config.activate.on-profile: staging
security:
  gateway:
    internal-token:
      enabled: true
      secret: ${GATEWAY_INTERNAL_TOKEN_SECRET}
  delivery-webhook:
    ip-whitelist:
      enabled: true
    signature:
      enabled: true
  payment-webhook:
    toss:
      ip-whitelist:
        enabled: true
      signature:
        enabled: true


---
spring.config.activate.on-profile: live
security:
  gateway:
    internal-token:
      enabled: true
      secret: ${GATEWAY_INTERNAL_TOKEN_SECRET}
  delivery-webhook:
    ip-whitelist:
      enabled: true
    signature:
      enabled: true
  payment-webhook:
    toss:
      ip-whitelist:
        enabled: true
      signature:
        enabled: true

