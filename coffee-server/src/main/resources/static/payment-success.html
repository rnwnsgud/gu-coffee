<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>결제 성공</title>
</head>
<body>
    <h1>결제 승인 중...</h1>
    <p id="result"></p>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const paymentKey = urlParams.get('paymentKey');
        const orderId = urlParams.get('orderId');
        const amount = urlParams.get('amount');

        if (paymentKey && orderId && amount) {
            // 백엔드 승인 API 호출
            fetch(`/v1/payments/comfirm?paymentKey=${paymentKey}&orderId=${orderId}&amount=${amount}`, {
                method: 'POST'
            })
            .then(async (response) => {
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('result').innerText = '결제가 성공적으로 완료되었습니다.';
                } else {
                    document.getElementById('result').innerText = '결제 승인 실패: ' + (data.message || '알 수 없는 오류');
                }
            })
            .catch((error) => {
                console.error('Error:', error);
                document.getElementById('result').innerText = '결제 승인 중 오류가 발생했습니다.';
            });
        } else {
            document.getElementById('result').innerText = '필수 결제 정보가 누락되었습니다.';
        }
    </script>
</body>
</html>
