<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <script src="https://js.tosspayments.com/v1/payment"></script>
    <title>결제 및 Kafka 파이프라인 테스트</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; line-height: 1.5; color: #222; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 20px; background: #fafafa; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        input { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        button { padding: 10px 16px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-right: 8px; margin-top: 6px; }
        .btn-primary { background: #3182f6; color: white; }
        .btn-secondary { background: #1b64da; color: white; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; }
        .hint { font-size: 12px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>커피 주문 결제 테스트 (Toss PG + Kafka)</h1>

    <div class="card">
        <h3>1. 인증 및 주문 정보</h3>
        <div class="form-group">
            <label for="principalId">사용자 ID (Header: Gu-Coffee-com.coffee.gu.Principal-Id)</label>
            <input id="principalId" type="text" value="U1" />
        </div>
        <div class="form-group">
            <label for="quantity">주문 수량 (아메리카노 4,500원, menuId=1, storeId=1)</label>
            <input id="quantity" type="number" value="10" min="1" />
            <div class="hint">10잔 주문 시 스탬프 10개가 적립되어 Kafka 컨슈머가 무료 음료 쿠폰을 즉시 자동 발급합니다.</div>
        </div>
        <button id="auto-create-btn" class="btn-secondary">① 백엔드 주문(Order) + 결제(Payment) 자동 생성</button>
    </div>

    <div class="card">
        <h3>2. 토스페이먼츠 결제창 호출</h3>
        <div class="hint" style="margin-bottom: 12px;">
            Swagger에서 직접 <code>POST /v1/orders</code>와 <code>POST /v1/payments</code>를 호출했다면 아래에 <code>orderKey</code>와 결제 금액을 붙여넣으세요.
        </div>
        <div class="form-group">
            <label for="orderKey">주문 키 (orderKey / Toss orderId)</label>
            <input id="orderKey" type="text" placeholder="예: 0K8..." />
        </div>
        <div class="form-group">
            <label for="amount">결제 금액 (amount)</label>
            <input id="amount" type="number" value="45000" />
        </div>
        <div class="form-group">
            <label for="orderName">주문명 (orderName)</label>
            <input id="orderName" type="text" value="아메리카노 10개" />
        </div>
        <button id="payment-button" class="btn-primary">② 토스 결제창 열기 (카드 결제)</button>
    </div>

    <pre id="log-box">대기 중...</pre>

    <script>
        const clientKey = 'test_ck_E92LAa5PVbNmadYjyvNRV7YmpXyJ';
        const tossPayments = TossPayments(clientKey);
        const logBox = document.getElementById('log-box');

        function log(msg, data) {
            const text = data ? `${msg}\n${JSON.stringify(data, null, 2)}` : msg;
            logBox.innerText = text;
        }

        function getHeaders() {
            const principalId = document.getElementById('principalId').value.trim();
            localStorage.setItem('gu_coffee_principal_id', principalId);
            return {
                'Content-Type': 'application/json',
                'Gu-Coffee-com.coffee.gu.Principal-Id': principalId,
                'Gu-Coffee-com.coffee.gu.Principal-Type': 'USER',
            };
        }

        // ① 주문 + 결제 자동 생성
        document.getElementById('auto-create-btn').addEventListener('click', async function () {
            try {
                const quantity = Number(document.getElementById('quantity').value);
                log('1/3 주문 생성 요청 중 (POST /v1/orders)...');

                const orderRes = await fetch('/v1/orders', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ menuId: 1, quantity: quantity, storeId: 1 }),
                });
                const orderJson = await orderRes.json();
                if (!orderRes.ok || orderJson.status !== 'SUCCESS') {
                    log('주문 생성 실패:', orderJson);
                    return;
                }
                const orderKey = orderJson.data.orderKey;

                log(`2/3 체크아웃 정보 조회 중 (GET /v1/orders/${orderKey}/checkout)...`);
                const checkoutRes = await fetch(`/v1/orders/${orderKey}/checkout`, {
                    headers: getHeaders(),
                });
                const checkoutJson = await checkoutRes.json();
                const totalPrice = checkoutJson.data.totalPrice;
                const orderName = checkoutJson.data.name;

                log('3/3 결제(READY) 생성 요청 중 (POST /v1/payments)...');
                const paymentRes = await fetch('/v1/payments', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ orderKey: orderKey, usedIssuedCouponId: null }),
                });
                const paymentJson = await paymentRes.json();
                if (!paymentRes.ok || paymentJson.status !== 'SUCCESS') {
                    log('결제 생성 실패:', paymentJson);
                    return;
                }

                document.getElementById('orderKey').value = orderKey;
                document.getElementById('amount').value = totalPrice;
                document.getElementById('orderName').value = orderName;

                log('백엔드 주문 + 결제(READY) 생성 완료! 이제 [② 토스 결제창 열기] 버튼을 누르세요.', {
                    orderKey: orderKey,
                    paymentId: paymentJson.data.paymentId,
                    amount: totalPrice,
                    orderName: orderName,
                });
            } catch (e) {
                log('오류 발생: ' + e.message);
            }
        });

        // Swagger에서 생성한 orderKey를 직접 붙여넣었을 때 자동으로 백엔드 주문 금액 동기화
        document.getElementById('orderKey').addEventListener('change', async function () {
            const orderKey = this.value.trim();
            if (!orderKey) return;
            try {
                const checkoutRes = await fetch(`/v1/orders/${encodeURIComponent(orderKey)}/checkout`, {
                    headers: getHeaders(),
                });
                if (checkoutRes.ok) {
                    const checkoutJson = await checkoutRes.json();
                    if (checkoutJson.status === 'SUCCESS' && checkoutJson.data) {
                        document.getElementById('amount').value = checkoutJson.data.totalPrice;
                        document.getElementById('orderName').value = checkoutJson.data.name;
                        log(`주문(${orderKey}) 금액 자동 동기화 완료: ${checkoutJson.data.totalPrice}원 (${checkoutJson.data.name})`);
                    }
                }
            } catch (e) {
                // 무시 (수동 입력 유지)
            }
        });

        // ② 토스 결제창 호출
        document.getElementById('payment-button').addEventListener('click', function () {
            const principalId = document.getElementById('principalId').value.trim();
            const orderId = document.getElementById('orderKey').value.trim();
            const amount = Number(document.getElementById('amount').value);
            const orderName = document.getElementById('orderName').value.trim() || '아메리카노';

            if (!orderId) {
                alert('orderKey를 입력하거나 [① 백엔드 주문 + 결제 자동 생성] 버튼을 먼저 눌러주세요.');
                return;
            }

            localStorage.setItem('gu_coffee_principal_id', principalId);

            tossPayments.requestPayment('카드', {
                amount: amount,
                orderId: orderId,
                orderName: orderName,
                successUrl: window.location.origin + '/payment-success.html',
                failUrl: window.location.origin + '/payment-fail.html',
            });
        });
    </script>
</body>
</html>
