services:
  mysql:
    image: mysql:8.0.38
    container_name: gu-coffee-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gu_coffee
      MYSQL_USER: coffee
      MYSQL_PASSWORD: coffee
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: gu-coffee-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
    name: gu-coffee-mysql-data
  redis-data:
    name: gu-coffee-redis-data
