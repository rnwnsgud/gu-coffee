spring:
  application.name: coffee-api
  profiles.active: local
  main:
    allow-bean-definition-overriding: true
  cache:
    type: simple
  lock:
    type: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100
  h2:
    console:
      enabled: true

storage:
  datasource:
    core:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:core;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      pool-name: core-db-pool
      data-source-properties:
        rewriteBatchedStatements: true

gu-coffee.storage.core.security.key: 11111111111111111111111111111111
gu-coffee.storage.core.security.iv: 1111111111111111
