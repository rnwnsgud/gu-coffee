        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1-webhooks-payments-toss172145739"
              examples:
                webhook-payment-toss:
                  value: "{\"status\":\"SUCCESS\",\"data\":{\"orderKey\":\"ORD-20261118-001\"\
                    ,\"paymentState\":\"CANCELED\",\"orderState\":\"CANCELED\",\"\
                    action\":\"CANCELED\"},\"error\":null}"
